# --- APARIENCIA ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 10

# Colores:
# --- AFTERGLOW THEME FOR KITTY ---

background #202020
foreground #d0d0d0
selection_background #303030
selection_foreground #d0d0d0
url_color #b4c973
cursor #d0d0d0

# Black
color0 #151515
color8 #505050

# Red
color1 #ac4142
color9 #ac4142

# Green
color2 #90a959
color10 #90a959

# Yellow
color3 #f4bf75
color11 #f4bf75

# Blue
color4 #6a9fb5
color12 #6a9fb5

# Magenta
color5 #aa759f
color13 #aa759f

# Cyan
color6 #75b5aa
color14 #75b5aa

# White
color7 #d0d0d0
color15 #f5f5f5

# --- RENDIMIENTO Y GRÁFICOS ---
# Esto habilita el protocolo gráfico para ver imágenes en Yazi
allow_remote_control yes
listen_on unix:@mykitty

# --- UX ---
cursor_shape block
cursor_blink_interval 0
# Cero distracciones. Sin barras de título nativas feas.
hide_window_decorations yes 
window_padding_width 4

# --- ATAJOS ---
# Moverse entre pestañas/ventanas como un humano
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
