# Preferencias personales de Ghostty para Omarchy.
#
# Este archivo NO se enlaza con Stow. Lo aplica scripts/ghostty-personal.sh
# agregando un bloque al final de ~/.config/ghostty/config, que Omarchy
# administra. El tema sigue viniendo de:
#   ~/.local/state/omarchy/current/theme/ghostty.conf
#
# Prohibido acá: background, foreground, palette, cursor-color,
# selection-*, theme, window-theme y cualquier color. Eso es del tema de Omarchy.

font-size = 10

# Comportamiento de ventana/terminal (no afecta colores ni tema).
mouse-hide-while-typing = true
copy-on-select = false
app-notifications = false
scrollback-limit = 10000

# Atajos personales. shift+enter se deja como lo define Omarchy.
keybind = ctrl+shift+n=new_window
keybind = ctrl+t=new_tab
keybind = ctrl+plus=increase_font_size:1
keybind = ctrl+minus=decrease_font_size:1
keybind = ctrl+zero=reset_font_size
