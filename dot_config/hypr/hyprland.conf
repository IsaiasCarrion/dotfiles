# -----------------------------------------------------------------------------
# CONFIGURACIÓN HYPRLAND - OPTIMIZADA (PERFORMANCE FIRST)
# -----------------------------------------------------------------------------

# --- 1. MONITOR & PREFS ---
monitor = , preferred, auto, 1

# --- 2. VARIABLES DE ENTORNO (CRÍTICAS) ---
# Backend
env = GDK_BACKEND,wayland,x11
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
# XDG
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
# Theming (Oscuro forzado)
env = GTK_THEME,Adwaita:dark
env = COLOR_SCHEME,prefer-dark
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_STYLE_OVERRIDE,kvantum

# Performance
env = MOZ_DISABLE_RDD_SANDBOX,1 # A veces ayuda con Firefox/Gecko apps

# --- 3. DEFINICIÓN DE PROGRAMAS ---
$terminal    = kitty
$menu        = fuzzel
$browser     = google-chrome-stable --enable-features=UseOzonePlatform --ozone-platform=wayland
$editor      = nvim
$lock        = hyprlock

# --- 4. AUTOSTART ---
# Servicios base
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/polkit-gnome-authentication-agent-1
exec-once = swww-daemon --format xrgb # xrgb es más rápido que argb si no usas transp. en wallpaper
exec-once = sleep 0.5 && swww img ~/.config/assets/backgrounds/cat_leaves.png --transition-fps 60
exec-once = hypridle

# Interfaz
exec-once = waybar
exec-once = mako
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# --- 5. LOOK & FEEL (OPTIMIZADO) ---
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    # Colores optimizados para lectura rápida
    col.active_border = rgb(00FFFF) rgb(24273A) 45deg
    col.inactive_border = rgb(24273A)
    layout = dwindle
    resize_on_border = true
    allow_tearing = false
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.95

    # Nueva sintaxis para sombras
    shadow {
        enabled = false
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 2
        passes = 2
        new_optimizations = true
        vibrancy = 0.1696
        ignore_opacity = true
        popups = true
    }
}

animations {
    enabled = false # Mantenido false por solicitud de velocidad
}

dwindle {
    pseudotile = true
    preserve_split = true
    # Lógica de foco inteligente
    force_split = 2
}

misc {
    # EL AJUSTE MÁS IMPORTANTE: Variable Frame Rate
    vfr = true
    vrr = 0 # 0=off, 1=on, 2=fullscreen (Activar si tienes monitor FreeSync)
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

input {
    kb_layout = latam
    repeat_rate = 50
    repeat_delay = 300
    follow_mouse = 1
}

# --- 6. WINDOW RULES ---
# Smart Gaps: Sin bordes ni gaps si solo hay una ventana (Estilo Monocle)
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
windowrulev2 = bordersize 0, floating:0, onworkspace:w[tv1]
windowrulev2 = rounding 0, floating:0, onworkspace:w[tv1]

# Evitar que apps XWayland se vean borrosas
windowrulev2 = noblur, class:^()$, title:^()$

# --- 7. KEYBINDINGS ---
$mainMod = SUPER

# Apps
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, B, exec, $browser
bind = $mainMod, O, exec, obsidian
bind = $mainMod, C, exec, $terminal -e $editor # Nvim en terminal explícita
bind = $mainMod SHIFT, C, exec, code
bind = $mainMod, D, exec, $menu
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, W, togglefloating,

# Portapapeles
bind = $mainMod, V, exec, cliphist list | fuzzel --dmenu -p "Portapapeles" | cliphist decode | wl-copy

# Screenshot (Area = Shift+Alt+S)
bind = SHIFT ALT, S, exec, grimblast --notify copy area
bind = , Print, exec, grimblast --notify copy screen

# Zoxide Launcher (Corrección del comando fallido)
# Abre una terminal flotante, ejecuta zoxide interactivo y al elegir, abre nueva instancia ahí.
bind = $mainMod, Z, exec, kitty --class floating_terminal -e bash -c 'cd "$(zoxide query -i)" && exec zsh'

# Audio
bindl = , XF86AudioMute, exec, pamixer -t
bindl = , XF86AudioLowerVolume, exec, pamixer -d 5
bindl = , XF86AudioRaiseVolume, exec, pamixer -i 5

# Screen brightness
bind = , XF86MonBrightnessUp, exec, brightnessctl s +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl s 5%-

# Mantener mapeo custom del usuario
bind = $mainMod, F9, exec, pamixer --default-source -t
bind = $mainMod, F10, exec, pamixer -d 5
bind = $mainMod, F11, exec, pamixer -i 5
bind = $mainMod, F12, exec, pamixer -t

# Movimiento y Ventanas
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod ALT, left, movewindow, l
bind = $mainMod ALT, right, movewindow, r
bind = $mainMod ALT, up, movewindow, u
bind = $mainMod ALT, down, movewindow, d

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Workspaces (Directos)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Mover a Workspaces
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Session
bind = $mainMod, L, exec, $lock
bind = $mainMod, ESCAPE, exec, wlogout

